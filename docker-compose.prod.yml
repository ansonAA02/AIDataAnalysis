services:
  mysql:
    image: mysql:8.4
    container_name: ai-finance-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_finance}
      MYSQL_USER: ${MYSQL_USER:-ai_finance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_finance_password}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-finance-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build:
      context: ./backend
    container_name: ai-finance-backend-prod
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_finance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ai_finance}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ai_finance_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 允許來自前端網域的跨域請求 (請在 .env 中設置你的真實域名，例如 https://yourdomain.com)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # 生產環境中，前端透過反向代理(Caddy)訪問後端，因此直接請求自己的 /api 即可
        VITE_API_BASE_URL: ""
    container_name: ai-finance-frontend-prod
    restart: always
    depends_on:
      - backend

  # Caddy 作為反向代理和自動 HTTPS 證書管理
  caddy:
    image: caddy:2.8-alpine
    container_name: ai-finance-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
