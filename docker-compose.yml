services:
  mysql:
    image: mysql:8.4
    container_name: ai-finance-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_finance}
      MYSQL_USER: ${MYSQL_USER:-ai_finance}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_finance_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ai-finance-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  # 修改项目根目录 .env（如 DEEPSEEK_API_KEY）后，需重建容器环境变量才会更新：
  # docker compose --profile dev up -d --force-recreate backend-dev
  backend-dev:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: ai-finance-backend-dev
    profiles:
      - dev
    working_dir: /workspace
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_finance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ai_finance}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ai_finance_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_THINKING_ENABLED: ${DEEPSEEK_THINKING_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./:/workspace
      - maven_cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "cd backend && mvn spring-boot:run"

  frontend-dev:
    image: node:22-alpine
    container_name: ai-finance-frontend-dev
    profiles:
      - dev
    working_dir: /workspace
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    command: sh -c "cd frontend && npm install && npm run dev"

volumes:
  mysql_data:
  redis_data:
  maven_cache:
  frontend_node_modules:
